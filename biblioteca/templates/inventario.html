{% extends "base.html" %}
{% block contenido %}
<h1>Inventario</h1>
<table>
  <div class="tabla-scroll">
    <table> ... </table>
  </div>
  <tr>
    <th>Nombre</th>
    <th>Tipo</th>
    <th>Disponible</th>
    <th>Total</th>
  </tr>
  {% for i in items %}
  <tr>
    <td>{{ i.nombre }}</td>
    <td>{{ i.tipo }}</td>
    <td>{{ i.stock_disponible }}</td>
    <td>{{ i.stock_total }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
